<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Halloween🎃</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6cc;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.1s;
        }

        /* 通常時のポップなカード */
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 { color: #ff6600; margin-bottom: 30px; }

        .btn-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 30px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-yes { background-color: #ff6600; color: white; }
        
        /* 逃げるボタンの初期スタイル */
        .btn-no {
            background-color: #333;
            color: white;
            position: absolute;
            left: 55%;
        }

        /* 画面クラッシュ（大人が焦る演出） */
        @keyframes glitch {
            0% { transform: translate(0) scale(1); filter: hue-rotate(0deg); }
            10% { transform: translate(-10px, 5px) scale(1.1); filter: hue-rotate(90deg); }
            20% { transform: translate(10px, -5px) scale(0.9); }
            30% { transform: translate(-5px, -10px) filter: invert(1); }
            40% { transform: translate(5px, 10px); }
            50% { transform: translate(0); }
        }
        .glitch-active {
            animation: glitch 0.3s infinite;
        }

        /* 恐怖の全画面ジャンプスケア */
        .scare-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            color: #ff0000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 8vw;
            font-weight: bold;
            letter-spacing: 10px;
            opacity: 0;
            pointer-events: none;
        }
        .scare-active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1 id="titleText">ハロウィンパーティー<br>一緒にいく？ 🎃</h1>
        <div class="btn-container">
            <button class="btn-yes" id="yesBtn">はい 🕸</button>
            <button class="btn-no" id="noBtn">いいえ 🦇</button>
        </div>
    </div>

    <!-- ドッキリ用全画面 -->
    <div class="scare-overlay" id="scareOverlay">
        <div>逃 ゲ ラ レ ナ イ</div>
        <div style="font-size: 3vw; margin-top: 20px; color: #fff;">SYSTEM ERROR: CRITICAL FAILURE</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainCard = document.getElementById('mainCard');
        const scareOverlay = document.getElementById('scareOverlay');
        
        let escapeCount = 0;

        // 1. ボタンが逃げる仕掛け（3回まで逃げる）
        noBtn.addEventListener('mouseover', () => {
            if (escapeCount >= 3) return; // 3回逃げたらそれ以上は逃げない（油断させる）

            // 画面内のランダムな位置に移動
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            
            escapeCount++;
        });

        // 2. ホラー発動関数（偽エラー画面 ＋ 大音量ノイズ ＋ 恐怖画面）
        function triggerScare() {
            // 画面をガタガタ揺らす（大人が「PCが壊れた！？」と焦る演出）
            document.body.classList.add('glitch-active');
            document.body.style.backgroundColor = '#000';
            mainCard.style.display = 'none';

            // ブラウザの機能で人工的に不気味な大音量ノイズを生成（mp3ファイル不要）
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2; // 2秒間
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                // ホワイトノイズの生成
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                // 音質を不気味に加工（ローパスフィルタ）
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);

                noise.connect(filter);
                filter.connect(audioCtx.destination);
                noise.start();
            } catch (e) {
                console.log("Audio play failed");
            }

            // 0.3秒後に一気に恐怖画面を表示（ジャンプスケア）
            setTimeout(() => {
                scareOverlay.classList.add('scare-active');
            }, 300);
        }

        // 3. 発動トリガー（諦めて「はい」を押すか、4回目に「いいえ」をクリックした時）
        yesBtn.addEventListener('click', triggerScare);
        noBtn.addEventListener('click', triggerScare);
    </script>
</body>
</html>
